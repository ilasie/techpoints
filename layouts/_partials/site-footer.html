<footer class="{{ .Site.Params.background_color_class | compare.Default "bg-black" }} bottom-0 w-100 pa3" role="contentinfo">
  <div class="flex items-center">
    <a class="f4 fw4 hover-white white-70 dn dib-ns pv2 ph3 no-underline" href="{{ .Site.Home.Permalink }}">
      &copy; {{ with .Site.Copyright | compare.Default .Site.Title }} {{ . | safe.HTML }} {{ now.Format "2006"}} {{ end }}
    </a>
    <p class="f4 fw4 white-70 dn dib-ns pv2 ph3">
      Powered by <a class="no-underline" href="https://gohugo.io/" target="_blank" rel="noopener noreferrer">Hugo</a> &
      <a class="no-underline" href="https://gohugo-ananke.github.io/" target="_blank" rel="noopener noreferrer">Ananke Theme</a>
    </p>
    <a class="f4 fw4 dn dib-ns pv2 ph3 no-underline" href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="license noopener noreferrer">
      CC BY-SA 4.0
    </a>
    <div>{{ partials.IncludeCached "social/follow.html" . }}</div>
  </div>
</footer>
